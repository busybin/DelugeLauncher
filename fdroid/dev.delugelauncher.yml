# fdroiddata submission draft for dev.delugelauncher; does not affect the build.
# Copy it wholesale to fdroiddata's metadata/dev.delugelauncher.yml to submit.

Categories:
  - Launcher
License: GPL-3.0-or-later
AuthorName: busybin
SourceCode: https://github.com/busybin/DelugeLauncher
IssueTracker: https://github.com/busybin/DelugeLauncher/issues
Changelog: https://github.com/busybin/DelugeLauncher/releases
AutoName: Deluge Launcher

RepoType: git
Repo: https://github.com/busybin/DelugeLauncher.git

Builds:
  # Fill in on release: the tag is plain digits (= versionCode), the commit is the full hash.
  - versionName: '25'
    versionCode: 25
    commit: 8323a71143eeacc21ee79a8ab2463a1d86e1cb95
    gradle: yes
  - versionName: '24'
    versionCode: 24
    commit: fd3f46af21bff0c146984333535cca11ad06d6d8
    gradle: yes

# Releases are signed by us; F-Droid re-signs with its own key (no Binaries/reproducible build is
# configured), so the two channels cannot upgrade over each other.

AutoUpdateMode: Version
# Tags are plain digits, so only tags ending in a digit count.
UpdateCheckMode: Tags .*[0-9]$
# versionCode lives in app/build.gradle.kts (the default only looks at build.gradle).
UpdateCheckData: app/build.gradle.kts|versionCode\s*=\s*(\d+)|.|versionName\s*=\s*"([^"]+)"
CurrentVersion: '25'
CurrentVersionCode: 25

# No anti-features: the release-page check is opt-in and off by default, and the app itself
# needs no network service.

RequiresRoot: false

MaintainerNotes: |-
  Deluge Launcher, a renamed fork of Victoria Launcher (GPL-3): package name, display name,
  icon and strings were all replaced, leaving only the upstream notices in LICENSE / NOTICE.
  The release keystore is not in the repo, so either build reproducibly with our key or accept
  F-Droid re-signing.
