name: Release

on:
  push:
    # Current tags are plain integers (= versionCode); v19-v23 are the old style.
    tags: ['v*', '[0-9]*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Put where a step's `if` can see it: the secrets context itself is not readable
    # from a condition, an environment variable holding one is.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test

      # Only when this repository actually has a keystore. Without one the build falls
      # back to an unsigned APK, which is the right answer for a fork that has not been
      # given its own signing key yet — a release that fails instead would be worse.
      - name: Write signing config
        if: env.KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Remove signing material
        if: always()
        run: rm -f release.keystore keystore.properties

      # Only when this repository has a keystore to sign with. An unsigned APK is not
      # something to hand anyone, so without one there is no release to publish — the run
      # still builds and tests, which is what a tag on an unsigned fork is worth.
      - name: Publish release
        if: env.KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            apk=app/build/outputs/apk/release/app-release.apk
          else
            apk=app/build/outputs/apk/release/app-release-unsigned.apk
          fi
          asset="deluge-launcher-${GITHUB_REF_NAME}.apk"
          cp "$apk" "$asset"

          version_code=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          notes="fastlane/metadata/android/en-US/changelogs/${version_code}.txt"

          # Idempotent: GitHub has delivered the same tag push twice, and the second run
          # then failed on a release that had in fact gone out perfectly well.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
          elif [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --notes-file "$notes" "$asset"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --generate-notes "$asset"
          fi
