name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No absolute paths
        # A lint baseline generated on a build machine once carried its $HOME into the
        # repository; tracked files describe the project, not where it was built.
        run: |
          if git grep -nE '\$HOME/|/home/[a-z]' -- . ':!.github/workflows/build.yml'; then
            echo "::error::a tracked file carries an absolute workspace path"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test

      - name: Lint
        run: ./gradlew lint

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: deluge-launcher-debug
          path: app/build/outputs/apk/debug/*.apk
