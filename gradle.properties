# Memory for the Gradle daemon and the Kotlin compiler.
# 4G, not the 2.5G this started with: the Kotlin compiler keeps an in-memory snapshot of
# the classpath to work out what actually changed, and it is the difference between an
# incremental build recompiling one file and recompiling all of them.
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC

# Build-loop speed: reuse task output between builds, run independent tasks in
# parallel, and skip re-running the configuration phase when nothing changed.
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# compileSdk 35 predates this AGP's tested-versions list. The app targets 35
# deliberately; drop this line when the AGP version is next raised.
android.suppressUnsupportedCompileSdk=35
